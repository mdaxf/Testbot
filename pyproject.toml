[project]
name = "web-test-framework"
dynamic = ["version"]
description = "Data-driven web UI test framework: Excel/JSON test cases, semantic + AI element location, SQL-backed test data, HTML/JUnit reporting."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.7",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyodbc>=5.1",
    "faker>=25.0",
    "anthropic>=0.34",
    "openai>=1.40",
    "google-genai>=0.3",
    "pyyaml>=6.0",
    "paho-mqtt>=1.6",
    "pika>=1.3",
    "kafka-python>=2.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.dynamic]
version = {attr = "framework.version.__version__"}

[tool.setuptools.packages.find]
include = ["framework*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
